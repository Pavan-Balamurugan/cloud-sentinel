apiVersion: 1

datasources:
  - name: OpenSearch
    uid: opensearch-ds
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    jsonData:
      database: "sentinel-logs-*"
      timeField: "timestamp"
      version: "2.11.1"
      flavor: opensearch
      pplEnabled: false
    editable: true
